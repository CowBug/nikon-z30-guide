name: 每日摄影技巧云端自动更新

on:
  schedule:
    # 每天北京时间 09:00 准时触发 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持在 GitHub 后台随时手动一键测试

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 调用 Gemini API 原创生成今日新技巧并重构图书库
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node daily_auto_generate.mjs

      - name: 提交并推送最新数据回 GitHub（自动触发 Cloudflare Pages 构建上线）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tips_data.json index.html
          git commit -m "Auto: 每日自动新增尼康Z30摄影技巧与图书库重构" || exit 0
          git push

